# Lean kube-prometheus-stack values for a local minikube demo.
# Trims resource usage and disables components not needed for this repo's scope.

# CRDs are installed separately (scripts/bootstrap.sh), not by this Helm release.
# The prometheus-operator CRDs are large enough that ArgoCD's client-side apply
# of them exceeds the Kubernetes 262144-byte metadata.annotations limit; letting
# the chart manage them through ArgoCD hits that every sync. Installing them
# once via `kubectl apply --server-side` and disabling them here is the
# documented workaround (and matches how most real ArgoCD + kube-prometheus-stack
# deployments are run).
crds:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec: {}
  additionalServiceMonitors:
    - name: sample-app
      selector:
        matchLabels:
          app: sample-app
      namespaceSelector:
        matchNames:
          - app
      endpoints:
        - port: http
          path: /metrics
          interval: 15s
    - name: greeter
      selector:
        matchLabels:
          app: greeter
      namespaceSelector:
        matchNames:
          - backend
      endpoints:
        - port: http
          path: /metrics
          interval: 15s

grafana:
  # No adminPassword set here on purpose: the chart auto-generates a random
  # password into a Secret (<release>-grafana). Retrieve it with:
  #   kubectl get secret -n monitoring kube-prometheus-stack-grafana \
  #     -o jsonpath="{.data.admin-password}" | base64 -d
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.local
    path: /
  sidecar:
    dashboards:
      enabled: true

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Drop heavier optional components not needed for this lean demo.
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
