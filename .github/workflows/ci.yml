name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest
      - run: pytest app/tests/ -v

  build-and-scan-image:
    runs-on: ubuntu-latest
    needs: test-app
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sample-app:ci ./app
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sample-app:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  lint-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform - lint plain k8s manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary gitops/sample-app
      - name: yamllint
        run: |
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: disable}}" gitops monitoring .github
