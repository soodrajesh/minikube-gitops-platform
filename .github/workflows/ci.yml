name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [app, greeter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ${{ matrix.app }}/requirements.txt pytest
      - run: pytest ${{ matrix.app }}/tests/ -v

  build-and-scan-image:
    runs-on: ubuntu-latest
    needs: test-app
    strategy:
      matrix:
        app: [app, greeter]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ${{ matrix.app }}:ci ./${{ matrix.app }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.app }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  lint-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform - lint plain k8s manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary gitops/greeter
          # gatekeeper's, cert-manager's, and sealed-secrets' CRD kinds (ConstraintTemplate,
          # K8sRequire*, ClusterIssuer, Certificate, SealedSecret, etc.) have no public schema
          # for kubeconform to validate against; just check they parse. gitops/sample-app is
          # included here too because it contains a SealedSecret alongside plain resources.
          ./kubeconform -strict -summary -ignore-missing-schemas gitops/sample-app gitops/policies gitops/tls
      - name: yamllint
        run: |
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: disable}}" gitops monitoring .github

  # Stands up a real (if scaled-down) cluster and applies the actual manifests from this repo,
  # instead of only linting them statically. Deliberately narrower than what scripts/deploy.sh
  # does locally:
  #   - Applies gitops/sample-app, gitops/greeter, gitops/policies, and gitops/tls directly via
  #     `kubectl apply`, not through ArgoCD. Getting a running ArgoCD to sync against this exact
  #     PR's commit (rather than the `main` branch every Application here points at) needs either
  #     a throwaway git remote or rewriting every source.targetRevision at runtime -- both add
  #     real complexity for a CI job. This still catches manifest bugs (bad selectors, missing
  #     probes, Gatekeeper/cert-manager ordering issues) -- it just doesn't exercise ArgoCD's
  #     sync mechanics.
  #   - Skips kube-prometheus-stack entirely: too heavy for a GitHub-hosted runner (2 CPU / 7GB
  #     shared with the OS), and the bugs it's caught locally (CRD-too-large, ServiceMonitor
  #     value path) are chart/values problems, not problems with this repo's own manifests.
  #   - Skips ingress-nginx: reaches the app via `kubectl port-forward` to the Service directly.
  #     Kind needs extra port-mapping config to expose ingress, which isn't worth it just to
  #     re-prove kubectl can port-forward. cert-manager's Certificate for sample-app still gets
  #     issued and checked here regardless -- ingress-shim doesn't need a working ingress
  #     controller to react to the Ingress's cert-manager.io/cluster-issuer annotation.
  #   - The HPA in gitops/sample-app/hpa.yaml applies cleanly (the autoscaling/v2 API is core
  #     Kubernetes, always present) but its metric stays <unknown> here: kind doesn't ship
  #     metrics-server and this job doesn't install one. Real autoscaling is only exercised by
  #     scripts/load-test.sh against the local minikube cluster.
  # See RUNBOOK.md and README.md "What's missing" for the full list of what this does and
  # doesn't cover, and run `scripts/deploy.sh` + `scripts/test.sh` locally for the full picture.
  e2e-smoke-test:
    runs-on: ubuntu-latest
    needs: [test-app, lint-manifests]
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: ci

      - name: Build and load images into kind
        run: |
          docker build -t sample-app:local ./app
          docker build -t greeter:local ./greeter
          kind load docker-image sample-app:local --name ci
          kind load docker-image greeter:local --name ci

      - name: Install Gatekeeper
        run: |
          helm repo add gatekeeper https://open-policy-agent.github.io/gatekeeper/charts
          helm repo update
          helm upgrade --install gatekeeper gatekeeper/gatekeeper \
            --namespace gatekeeper-system --create-namespace \
            --set replicas=1 --set audit.replicas=1 \
            --wait --timeout 5m

      - name: Apply Gatekeeper ConstraintTemplates and wait for their CRDs
        run: |
          kubectl apply -f gitops/policies/templates/
          for k in k8srequirenonroot k8sdisallowprivilegeescalation k8srequireresources k8sdisallowlatesttag; do
            echo "waiting for CRD ${k}.constraints.gatekeeper.sh"
            until kubectl get crd "${k}.constraints.gatekeeper.sh" >/dev/null 2>&1; do sleep 2; done
          done

      - name: Apply Gatekeeper Constraints
        run: |
          # Everything in this directory except podmonitor.yaml: that needs the
          # monitoring.coreos.com PodMonitor CRD, which only exists because
          # kube-prometheus-stack installs it -- and kube-prometheus-stack itself is
          # skipped in this job (see the top-of-file comment). Applying it here would
          # fail with "no matches for kind PodMonitor".
          kubectl apply -f gitops/policies/constraints/constraints.yaml
          kubectl apply -f gitops/policies/constraints/grafana-dashboard.yaml

      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --set crds.enabled=true --set replicaCount=1 \
            --set webhook.replicaCount=1 --set cainjector.replicaCount=1 \
            --wait --timeout 5m

      - name: Apply the local CA (gitops/tls) and wait for it to be ready
        run: |
          kubectl apply -f gitops/tls/
          kubectl wait --for=condition=Ready clusterissuer/selfsigned-issuer --timeout=60s
          kubectl wait --for=condition=Ready certificate/local-ca -n cert-manager --timeout=60s
          kubectl wait --for=condition=Ready clusterissuer/ca-issuer --timeout=60s

      - name: Install Sealed Secrets
        run: |
          helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
          helm repo update
          helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets \
            --namespace sealed-secrets --create-namespace \
            --wait --timeout 5m

      - name: Apply sample-app and greeter
        run: |
          # ArgoCD normally creates these via CreateNamespace=true; kubectl apply doesn't.
          kubectl create namespace app --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace backend --dry-run=client -o yaml | kubectl apply -f -
          # gitops/sample-app/sealed-secret.yaml is ciphertext sealed against the maintainer's
          # local minikube cluster's key -- it can never decrypt against this kind cluster's own
          # (freshly generated) key, by design; that's the whole point of sealed-secrets. Create
          # the plaintext Secret directly instead, so the Deployment's secretKeyRef resolves the
          # same way it would once the real SealedSecret unseals locally. The SealedSecret object
          # itself still gets applied below and will sit in a permanently-failed state in this
          # cluster; that's expected and harmless, it doesn't own or block the Secret above.
          kubectl create secret generic sample-app-secret -n app \
            --from-literal=api-key=ci-smoke-test-dummy-key \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f gitops/sample-app/
          kubectl apply -f gitops/greeter/
          kubectl rollout status deployment/sample-app -n app --timeout=120s
          kubectl rollout status deployment/greeter -n backend --timeout=120s
          # cert-manager's ingress-shim watches the Ingress's cert-manager.io/cluster-issuer
          # annotation regardless of which ingress controller is installed, so this issues
          # even though ingress-nginx itself isn't set up in this CI environment.
          kubectl wait --for=condition=Ready certificate/sample-app-tls -n app --timeout=60s
          # Confirms the HPA object itself is well-formed and accepted by the API server; its
          # metric stays <unknown> here since kind has no metrics-server (see the job's comment).
          kubectl get hpa -n app sample-app

      - name: Smoke test the deployed app
        run: |
          kubectl -n app port-forward svc/sample-app 8080:80 &
          PF_PID=$!
          sleep 3
          curl -sf --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8080/health | tee /tmp/health.json
          echo
          [ "$(jq -r .api_key_configured /tmp/health.json)" = "true" ]
          curl -sf --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8080/greeting | grep -q greeting
          kill "$PF_PID"

      - name: Verify Gatekeeper actually blocks a non-compliant pod
        run: |
          if kubectl run bad-pod -n app --image=nginx:latest --restart=Never --dry-run=server; then
            echo "expected Gatekeeper to reject this pod, but it was allowed" >&2
            exit 1
          fi
