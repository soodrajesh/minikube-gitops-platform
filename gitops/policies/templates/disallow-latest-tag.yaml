apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatesttag
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatesttag

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          img := container.image
          endswith(img, ":latest")
          msg := sprintf("container <%v> uses forbidden ':latest' tag: %v", [container.name, img])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          img := container.image
          not contains(img, ":")
          msg := sprintf("container <%v> image '%v' has no tag (defaults to :latest)", [container.name, img])
        }
