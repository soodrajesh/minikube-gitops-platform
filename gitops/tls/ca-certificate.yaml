# The local CA cert/key, self-signed by selfsigned-issuer. Lives in the cert-manager
# namespace because a ClusterIssuer of kind CA can only reference secrets in
# cert-manager's configured "cluster resource namespace" (default: cert-manager itself).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: minikube-gitops-platform local CA
  secretName: local-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
